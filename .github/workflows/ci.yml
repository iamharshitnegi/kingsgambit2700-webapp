name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt an in-flight production deployment or migration.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://kingsgambit2700.in
      NEXT_PUBLIC_API_BASE_URL: https://api.kingsgambit2700.in
      API_BASE_URL: https://api.kingsgambit2700.in
      EDITORIAL_CONTENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          go-package: ./...
          work-dir: backend

  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://kingsgambit2700.in
      NEXT_PUBLIC_API_BASE_URL: https://api.kingsgambit2700.in
      API_BASE_URL: https://api.kingsgambit2700.in
      EDITORIAL_CONTENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run generate:api
      - run: go generate ./...
        working-directory: backend
      - run: git diff --exit-code

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KG_ENV: test
      KG_TEST_DATABASE_URL: postgres://kg2700:kg2700@localhost:5432/kg2700?sslmode=disable
      KG_DATABASE_URL: postgres://kg2700:kg2700@localhost:5432/kg2700?sslmode=disable
      KG_DATABASE_DIRECT_URL: postgres://kg2700:kg2700@localhost:5432/kg2700?sslmode=disable
      KG_REDIS_URL: redis://localhost:6379/0
      KG_S3_ENDPOINT: http://localhost:9090
      KG_S3_REGION: us-east-1
      KG_S3_ACCESS_KEY_ID: local-access-key
      KG_S3_SECRET_ACCESS_KEY: local-secret-key
      KG_S3_BUCKET_QUARANTINE: kg2700-quarantine
      KG_S3_BUCKET_CLEAN: kg2700-clean
      KG_S3_FORCE_PATH_STYLE: "true"
      KG_CLAMAV_ADDR: localhost:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: docker compose up -d --wait postgres redis s3mock mailpit clamav
      - run: docker compose --profile app run --rm --no-deps migrate
      - run: docker compose --profile app run --rm river-migrate up
      - run: docker compose --profile app run --rm river-migrate validate
      - run: go test -p 1 -race -tags=integration ./...
        working-directory: backend
      - if: always()
        run: docker compose logs --no-color > compose-services.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-service-logs
          path: compose-services.log
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: |
          for script in deploy/vps/*.sh; do bash -n "$script"; done
      - run: python3 -m unittest discover -s tests/deploy -v

  deploy:
    needs: [frontend, backend, generated-code, integration, compose]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-vps.yml
    secrets:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
